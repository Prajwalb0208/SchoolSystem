<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="yes" />
    <meta name="screen-orientation" content="portrait" />
    <title>Infinite Cars</title>
    <link rel="stylesheet" href="./infinite-cars-styles.css" />
    <script>
      console.clear();
      // Patch asset paths
      window.ASSET_BASE_PATH = './infinite-cars-assets/';
    </script>
  </head>
  <body>
    <div id="infinite-cars"></div>
    <script src="./infinite-cars-scripts/libs/phaser.min.js"></script>
    <script>
      // Patch the processed script to use correct asset paths
      const assetBasePath = './infinite-cars-assets/';
      
      // Patch image loading
      const originalImageLoad = Phaser.Loader.LoaderPlugin.prototype.image;
      Phaser.Loader.LoaderPlugin.prototype.image = function(key, url) {
        if (url && typeof url === 'string') {
          if (url.startsWith('./assets/images/')) {
            url = url.replace('./assets/images/', assetBasePath + 'images/');
          } else if (url.startsWith('./assets/')) {
            url = url.replace('./assets/', assetBasePath);
          }
        }
        return originalImageLoad.call(this, key, url);
      };
      
      // Patch audio loading - handle both string and array formats
      const originalAudioLoad = Phaser.Loader.LoaderPlugin.prototype.audio;
      Phaser.Loader.LoaderPlugin.prototype.audio = function(key, urls) {
        if (Array.isArray(urls)) {
          urls = urls.map(url => {
            if (typeof url === 'string') {
              if (url.startsWith('./assets/audios/')) {
                return url.replace('./assets/audios/', assetBasePath + 'audios/');
              } else if (url.startsWith('./assets/')) {
                return url.replace('./assets/', assetBasePath);
              }
            }
            return url;
          });
        } else if (urls && typeof urls === 'string') {
          if (urls.startsWith('./assets/audios/')) {
            urls = urls.replace('./assets/audios/', assetBasePath + 'audios/');
          } else if (urls.startsWith('./assets/')) {
            urls = urls.replace('./assets/', assetBasePath);
          }
        }
        return originalAudioLoad.call(this, key, urls);
      };
      
      // Also patch the file loading to handle audio errors gracefully
      const originalFileLoad = Phaser.Loader.FileTypesManager.prototype.audio;
      if (originalFileLoad) {
        Phaser.Loader.FileTypesManager.prototype.audio = function(key, urls, config) {
          // Ensure audio paths are correct
          if (Array.isArray(urls)) {
            urls = urls.map(url => {
              if (typeof url === 'string' && url.includes('./assets/audios/')) {
                return url.replace('./assets/audios/', assetBasePath + 'audios/');
              }
              return url;
            });
          } else if (typeof urls === 'string' && urls.includes('./assets/audios/')) {
            urls = urls.replace('./assets/audios/', assetBasePath + 'audios/');
          }
          return originalFileLoad.call(this, key, urls, config);
        };
      }
    </script>
    <script src="./infinite-cars-scripts/infinite-cars.processed.js"></script>
  </body>
</html>
