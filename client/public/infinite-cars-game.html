<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="yes" />
    <meta name="screen-orientation" content="portrait" />
    <title>Infinite Cars</title>
    <link rel="stylesheet" href="./styles/infinite-cars.css" />
    <script>
      console.clear();
      // Patch asset paths
      window.ASSET_BASE_PATH = './infinite-cars-assets/';
    </script>
  </head>
  <body>
    <div id="infinite-cars"></div>
    <script src="./infinite-cars-scripts/libs/phaser.min.js"></script>
    <script>
      // Patch asset paths BEFORE Phaser loads
      const assetBasePath = './infinite-cars-assets/';
      
      // Store original Phaser methods before they're used
      let phaserLoaded = false;
      
      // Patch image loading
      const patchImageLoad = function() {
        if (typeof Phaser !== 'undefined' && Phaser.Loader && Phaser.Loader.LoaderPlugin) {
          const originalImageLoad = Phaser.Loader.LoaderPlugin.prototype.image;
          Phaser.Loader.LoaderPlugin.prototype.image = function(key, url) {
            if (url && typeof url === 'string') {
              if (url.includes('./assets/images/')) {
                url = url.replace('./assets/images/', assetBasePath + 'images/');
              } else if (url.includes('./assets/') && !url.includes(assetBasePath)) {
                url = url.replace('./assets/', assetBasePath);
              }
            }
            return originalImageLoad.call(this, key, url);
          };
        }
      };
      
      // Patch audio loading - more comprehensive
      const patchAudioLoad = function() {
        if (typeof Phaser !== 'undefined' && Phaser.Loader && Phaser.Loader.LoaderPlugin) {
          const originalAudioLoad = Phaser.Loader.LoaderPlugin.prototype.audio;
          Phaser.Loader.LoaderPlugin.prototype.audio = function(key, urls) {
            const fixUrl = (url) => {
              if (typeof url === 'string') {
                if (url.includes('./assets/audios/')) {
                  return url.replace('./assets/audios/', assetBasePath + 'audios/');
                } else if (url.includes('./assets/') && !url.includes(assetBasePath)) {
                  return url.replace('./assets/', assetBasePath);
                }
              }
              return url;
            };
            
            if (Array.isArray(urls)) {
              urls = urls.map(fixUrl);
            } else if (urls) {
              urls = fixUrl(urls);
            }
            
            return originalAudioLoad.call(this, key, urls);
          };
        }
      };
      
      // Patch when Phaser is available
      const checkAndPatch = setInterval(() => {
        if (typeof Phaser !== 'undefined') {
          patchImageLoad();
          patchAudioLoad();
          clearInterval(checkAndPatch);
          phaserLoaded = true;
        }
      }, 10);
      
      // Also patch immediately after Phaser script loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          patchImageLoad();
          patchAudioLoad();
        }, 100);
      });
    </script>
    <script type="module" src="./infinite-cars-scripts/infinite-cars.processed.js"></script>
  </body>
</html>
